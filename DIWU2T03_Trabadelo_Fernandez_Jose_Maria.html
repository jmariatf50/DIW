<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra de billetes de viaje</title>

</head>
<body>

    <h1> Compra de billetes</h1>

    <form>
        
        <label for = "nombre"> Nombre:</label>
        <input type = "text" name="nombre" required>
        <br>

        <label for = "apellidos"> Apellidos:</label>
        <input type = "text" name="apellidos" required>
        <br>

        <label for = "CorreoElectronico"> Correo Electronico:</label>
        <input type = "text" name="CorreoElectronico" required>
        <br>

        <label for="origen">Origen:</label>
            <select id="origen" name="origen" required>
                <option value="">Selecciona el origen</option>
                <option value="madrid">Madrid</option>
                <option value="barcelona">Barcelona</option>
                <option value="oviedo">Oviedo</option>
                <option value="sevilla">Sevilla</option>
                <option value="valencia">Valencia</option>
            </select>
        <br>

        <label for="destino">Destino:</label>
            <select id="destino" name="destino" required>
                <option value="">Selecciona el destino</option>
                <option value="madrid">Madrid</option>
                <option value="barcelona">Barcelona</option>
                <option value="oviedo">Oviedo</option>
                <option value="sevilla">Sevilla</option>
                <option value="valencia">Valencia</option>
            </select>
        <br>

        <label for="adultos">Número de adultos:</label>
        <input type="number" id="adultos" name="adultos" min="1" value="1" required>
        <br>

        <label for="ninos">Número de niños:</label>
            <input type="number" id="ninos" name="ninos" min="0" value="0" required>
        <br>

        <label for="hora">Hora y minutos de partida:</label>
        <input type="time" id="hora" name="hora" required>
        <br>

        <label for="fecha">Fecha de partida:</label>
        <input type="date" id="fecha" name="fecha" required>
        <br>
        

        <label for= "metodoPago"> Metodo de Pago</label>
        <br>
        <input type = "radio" name = "metodoPago" value="1"> Tarejeta de Credito
        <br>
        <input type = "radio" name = "metodoPago" value="2"> Saldo
        <br> 
        <input type = "radio" name = "metodoPago" value="3"> Bizum
        <br>

         <button type="reset">Restablecer</button>
        <button type="submit">Enviar</button>

    </form> 
    
</body>
</html>
